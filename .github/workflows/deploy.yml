name: Deploy Zestia to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zestia-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
  publish-and-deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      OCI_HOST: ${{ vars.OCI_HOST }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER }}
      OCI_DEPLOY_DIR: ${{ vars.OCI_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate deployment configuration
        run: |
          [[ "$OCI_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$OCI_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$OCI_DEPLOY_DIR" =~ ^/opt/[a-zA-Z0-9/_-]+$ ]]
          docker compose --env-file deploy/fixtures/production.conf -f deploy/compose.yaml config --quiet --no-env-resolution
          bash -n deploy/deploy-and-verify.sh
      - id: image
        name: Name immutable release
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image for smoke testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: zestia:predeploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production image
        run: python scripts/smoke_image.py zestia:predeploy
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish verified image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          release_tag="$IMAGE_NAME:$GITHUB_SHA"
          docker tag zestia:predeploy "$release_tag"
          docker push "$release_tag"
          repository_digest=$(docker image inspect "$release_tag" --format '{{index .RepoDigests 0}}')
          echo "digest=${repository_digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Configure verified SSH connection
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          test -n "$OCI_SSH_KEY"
          test -n "$OCI_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Upload release manifests
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$OCI_SSH_USER@$OCI_HOST" "sudo install -d -m 750 -o '$OCI_SSH_USER' '$OCI_DEPLOY_DIR/releases/$GITHUB_SHA'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.yaml deploy/Caddyfile deploy/deploy-and-verify.sh "$OCI_SSH_USER@$OCI_HOST:$OCI_DEPLOY_DIR/releases/$GITHUB_SHA/"
      - name: Deploy by immutable digest and verify HTTPS
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$OCI_SSH_USER@$OCI_HOST" "set -eu; registry_config=\$(mktemp -d); trap 'rm -rf \"\$registry_config\"' EXIT; export DOCKER_CONFIG=\"\$registry_config\"; docker login ghcr.io -u '$REGISTRY_USER' --password-stdin; bash '$OCI_DEPLOY_DIR/releases/$GITHUB_SHA/deploy-and-verify.sh' '$DEPLOY_IMAGE'"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
