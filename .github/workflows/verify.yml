name: Zestia verification

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-image:
    name: Verify production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate deployment manifests
        run: |
          docker compose --env-file deploy/fixtures/production.conf -f deploy/compose.yaml config --quiet --no-env-resolution
          bash -n deploy/deploy-and-verify.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: zestia:predeploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production image
        run: python scripts/smoke_image.py zestia:predeploy
  verify:
    name: Verify (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Install pinned offline secret scanner
        run: |
          GOBIN="$RUNNER_TEMP/zestia-tools" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/zestia-tools" >> "$GITHUB_PATH"
      - name: Start isolated PostgreSQL
        run: docker compose --env-file tests/fixtures/ci.env up -d --wait --wait-timeout 90
      - name: Run shared verification
        run: python scripts/verify.py --env-file tests/fixtures/ci.env
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker compose --env-file tests/fixtures/ci.env down --volumes
