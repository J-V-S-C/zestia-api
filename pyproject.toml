[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realimenta-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.9,<1", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL TEST_DATABASE_URL ending in _test", "e2e: complete HTTP application flow with real PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
