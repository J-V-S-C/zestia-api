services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realimenta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realimenta}
      POSTGRES_DB: ${POSTGRES_DB:-realimenta_e01}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
